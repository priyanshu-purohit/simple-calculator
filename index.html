<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Simple Calculator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Roboto, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; background:#f4f7fb; margin:0; }
    .calc { background:#fff; padding:12px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.08); width:320px; }
    .display { height:56px; border-radius:6px; background:#222; color:#fff; font-size:28px; text-align:right; padding:10px; box-sizing:border-box; margin-bottom:12px; overflow:hidden; word-break:break-all; }
    .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    button { font-size:18px; padding:14px; border:none; border-radius:6px; cursor:pointer; }
    button.op { background:#f0ad4e; color:#fff; }
    button.num { background:#e9eef6; }
    button.action { background:#5cb85c; color:#fff; }
    button.func { background:#6c757d; color:#fff; }
  </style>
</head>
<body>
  <div class="calc">
    <div id="display" class="display">0</div>
    <div class="keys">
      <button class="func" data-action="clear">C</button>
      <button class="func" data-action="neg">+/-</button>
      <button class="func" data-action="percent">%</button>
      <button class="op" data-op="/">÷</button>

      <button class="num">7</button><button class="num">8</button><button class="num">9</button><button class="op" data-op="*">×</button>

      <button class="num">4</button><button class="num">5</button><button class="num">6</button><button class="op" data-op="-">−</button>

      <button class="num">1</button><button class="num">2</button><button class="num">3</button><button class="op" data-op="+">+</button>

      <button class="num" style="grid-column: span 2;">0</button><button class="num">.</button><button class="action" data-action="equals">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    // We'll keep three parts: left operand, operator, right operand.
    // This lets the display always show the full expression like "2+2" while typing.
    let left = '0';
    let operator = '';
    let right = '';

    function update() {
      const expr = operator ? (left + operator + right) : left;
      display.textContent = expr || '0';
    }

    function inputNum(n) {
      if (!operator) {
        if (n === '.' && left.includes('.')) return;
        if (left === '0' && n !== '.') left = n;
        else left = left + n;
      } else {
        if (n === '.' && right.includes('.')) return;
        if (right === '' && n === '.') right = '0.';
        else right = right + n;
      }
      update();
    }

    function applyOp(nextOp) {
      if (operator && right !== '') {
        // compute first, then set new operator
        const ok = compute();
        if (!ok) return; // e.g., division by zero
      }
      operator = nextOp;
      update();
    }

    function compute() {
      if (!operator || right === '') return true; // nothing to compute
      const a = parseFloat(left);
      const b = parseFloat(right);
      let result;
      if (operator === '+') result = a + b;
      else if (operator === '-') result = a - b;
      else if (operator === '*') result = a * b;
      else if (operator === '/') {
        if (b === 0) {
          left = 'Error'; operator = ''; right = '';
          update();
          return false;
        }
        result = a / b;
      } else return false;

      // normalize result string (remove trailing .0)
      if (!isNaN(result) && Number.isFinite(result) && Math.trunc(result) === result) {
        left = String(Math.trunc(result));
      } else {
        left = String(result);
      }
      operator = '';
      right = '';
      update();
      return true;
    }

    function clearAll() {
      left = '0'; operator = ''; right = ''; update();
    }

    function toggleNeg() {
      if (!operator) {
        if (left === '0') return;
        left = String(-parseFloat(left));
      } else {
        if (right === '') return;
        right = String(-parseFloat(right));
      }
      update();
    }

    function percent() {
      if (!operator) {
        left = String(parseFloat(left) / 100);
      } else {
        if (right === '') return;
        right = String(parseFloat(right) / 100);
      }
      update();
    }

    function backspace() {
      if (right !== '') {
        right = right.slice(0, -1);
      } else if (operator !== '') {
        operator = '';
      } else {
        left = left.slice(0, -1);
        if (left === '' || left === '-') left = '0';
      }
      update();
    }

    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('num')) {
          inputNum(btn.textContent.trim());
        } else if (btn.classList.contains('op')) {
          applyOp(btn.dataset.op);
        } else if (btn.dataset.action === 'clear') {
          clearAll();
        } else if (btn.dataset.action === 'equals') {
          compute();
        } else if (btn.dataset.action === 'neg') {
          toggleNeg();
        } else if (btn.dataset.action === 'percent') {
          percent();
        }
      });
    });

    // keyboard support
    document.addEventListener('keydown', (e) => {
      if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
        inputNum(e.key);
      } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
        applyOp(e.key);
      } else if (e.key === 'Enter' || e.key === '=') {
        compute();
      } else if (e.key === 'Backspace') {
        backspace();
      } else if (e.key.toLowerCase() === 'c') {
        clearAll();
      }
    });

    // initialize
    update();
  </script>
</body>
</html>
